<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التقويم — مسار</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site">
  <div class="wrap">
    <a class="brand" href="index.html">
      <span class="mark">م</span>
      <span class="name">مبادرة مسار</span>
    </a>
    <nav class="site-nav">
      <a href="gpa.html">حاسبة المعدل</a>
      <a href="absence.html">حاسبة الغياب</a>
      <a href="calendar.html" class="active">التقويم</a>
      <span class="social-group">
        <a class="social-link" href="https://t.me/mssarr" target="_blank" rel="noopener" title="قناة مسار على تيليجرام">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.8 4.4 18.6 20c-.2 1-.9 1.3-1.7.8l-4.8-3.5-2.3 2.2c-.3.3-.5.5-1 .5l.3-4.9 8.9-8c.4-.3-.1-.5-.6-.2L6 12.3l-4.8-1.5c-1-.3-1-1 .2-1.5L20.4 3c.9-.3 1.6.2 1.4 1.4Z"/></svg><span>تابعونا في تيليجرام</span>
        </a>
        <a class="social-link" href="https://x.com/mssar_k" target="_blank" rel="noopener" title="حساب مسار على X">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 2H22l-7.6 8.7L23.3 22h-7l-5.5-7.2L4.5 22H1.4l8.1-9.3L1 2h7.2l5 6.6L18.9 2Zm-1.2 18h1.7L7.4 4H5.6l12.1 16Z"/></svg><span>تابعونا في X</span>
        </a>
      </span>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <p class="eyebrow">فعاليات ومواعيد الفصل</p>
    <h1 class="page-title">التقويم الدراسي</h1>
    <p class="page-sub">اضغط على أي يوم لعرض فعالياته أو إضافة موعد جديد. يتم حفظ مواعيدك في متصفحك تلقائيًا.</p>

    <div class="panel">
      <div class="cal-head">
        <div class="cal-nav">
          <button id="prevMonth" type="button">‹</button>
          <button id="nextMonth" type="button">›</button>
        </div>
        <div class="month-label" id="monthLabel">—</div>
      </div>
      <div class="cal-grid" id="calGrid"></div>

      <div class="event-panel">
        <div id="selectedDateLabel" class="eyebrow">اختر يومًا من التقويم</div>
        <div id="eventList"></div>
        <div class="event-form" id="eventForm" style="display:none;">
          <input type="text" id="eventTitle" placeholder="عنوان الموعد">
          <input type="text" id="eventNote" placeholder="ملاحظة (اختياري)">
          <button class="btn btn-primary" id="addEvent" type="button" style="grid-column:1/-1;">إضافة الموعد</button>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="site">مسار — أداة مستقلة لتسهيل الحياة الدراسية</footer>

<script src="script.js"></script>
</body>
</html>
